<!-- BOTTOM NAVIGATION BAR (MOBILE ONLY) -->
<nav class="lg:hidden fixed bottom-0 left-0 right-0 z-[100] flex items-end justify-between" 
     style="background: linear-gradient(135deg, #181D00 0%, #234A2B 50%, #181D00 100%); height: 72px; padding: 0 16px; box-shadow: 0 -10px 40px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.15);">
    
    <div id="bottom-floating-pill"></div>
    
    <a href="{{ url_for('dashboard') }}" class="bottom-nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
        <i data-lucide="layout-dashboard"></i>
        <span>Home</span>
    </a>

    {% if current_user.role == 'teacher' or current_user.role == 'admin' %}
    <a href="{{ url_for('teacher_profiles') }}" class="bottom-nav-item {% if request.endpoint == 'teacher_profiles' or request.endpoint == 'teacher_view_profile' %}active{% endif %}">
        <i data-lucide="users"></i>
        <span>Students</span>
    </a>
    <a href="{{ url_for('teacher_verify_challenges') }}" class="bottom-nav-item {% if request.endpoint == 'teacher_verify_challenges' %}active{% endif %}">
        <i data-lucide="check-circle"></i>
        <span>Verify</span>
    </a>
    {% else %}
    <a href="{{ url_for('challenges') }}" class="bottom-nav-item {% if request.endpoint == 'challenges' %}active{% endif %}">
        <i data-lucide="puzzle"></i>
        <span>Quests</span>
    </a>
    <a href="{{ url_for('achievements') }}" class="bottom-nav-item {% if request.endpoint == 'achievements' %}active{% endif %}">
        <i data-lucide="award"></i>
        <span>Badges</span>
    </a>
    {% endif %}

    <a href="{{ url_for('leaderboard') }}" class="bottom-nav-item {% if request.endpoint == 'leaderboard' %}active{% endif %}">
        <i data-lucide="bar-chart-2"></i>
        <span>Rank</span>
    </a>

    <a href="{{ url_for('profile') }}" class="bottom-nav-item {% if request.endpoint == 'profile' %}active{% endif %}">
        <div class="bottom-nav-avatar">
            <img src="{{ url_for('static', filename='uploads/' + (current_user.profile_pic or 'default.png')) }}"
                 onerror="this.src='{{ url_for('static', filename='uploads/default.png') }}'"
                 alt="Profile">
        </div>
        <span>Profile</span>
    </a>

</nav>


<style>
/* Bottom Nav Base - COMPACT MOBILE OPTIMIZED */
.bottom-nav-item {
    position: relative;
    width: 20%; /* Evenly distribute space (5 items = 20%) */
    max-width: 64px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px; /* Tighter gap */
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    
    border-radius: 0;
    z-index: 10;
}

.bottom-nav-item i {
    width: 20px; /* Reduced from 22px */
    height: 20px;
    stroke-width: 2; /* Slightly thicker for better visibility at small sizes */
    
}

.bottom-nav-item span {
    font-size: 10px; /* Reduced from 11px */
    font-weight: 500;
    letter-spacing: 0.2px;
    
}

/* Floating Pill - Compact Size */
#bottom-floating-pill {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 60px; /* Compact width */
    background: #F7F7F2;
    border-radius: 0 0 24px 24px; /* Tighter bottom curve */
    z-index: 5;
     /* Snappy smooth transition */
    pointer-events: none;
    opacity: 0;
}

/* Tighter cutouts */
#bottom-floating-pill::before {
    content: "";
    position: absolute;
    top: 0;
    left: -16px;
    width: 16px;
    height: 16px;
    background: radial-gradient(circle at bottom left, transparent 16px, #F7F7F2 16px);
    pointer-events: none;
}

#bottom-floating-pill::after {
    content: "";
    position: absolute;
    top: 0;
    right: -16px;
    width: 16px;
    height: 16px;
    background: radial-gradient(circle at bottom right, transparent 16px, #F7F7F2 16px);
    pointer-events: none;
}

/* Active State Styles */
.bottom-nav-item.active {
    color: #181D00;
    font-weight: 600;
}
.bottom-nav-item.active i { color: #181D00; }
.bottom-nav-item.active span { font-weight: 600; font-size: 11px; } /* Slightly larger when active */

/* Avatar */
.bottom-nav-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid currentColor;
    overflow: hidden;
    padding: 1px;
}
.bottom-nav-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

/* Navigation Container adjustments */
nav.lg\:hidden {
    height: 68px !important; /* Compact height */
    padding: 0 16px !important; /* Reduced padding so items can spread better */
}
</style>
