 <!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>{% block title %}Admin Portal | EduEco{% endblock %}</title>

 <!-- General Sans Font -->
 <link rel="preconnect" href="https://api.fontshare.com">
 <link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,201,300,301,400,401,500,501,600,601,700,701,1,2&display=swap" rel="stylesheet">

 <!-- FontAwesome -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

 <!-- Tailwind CSS -->
 <script src="https://cdn.tailwindcss.com"></script>
 <script>
 tailwind.config = {
 theme: {
 extend: {
 fontFamily: {
 sans: ['General Sans', 'sans-serif'],
 },
 colors: {
 admin: {
 sidebar: '#181D00',
 surface: '#F4F4EF',
 card: '#FFFFFF',
 text: '#111111',
 textMuted: '#666666',
 textFaded: '#888888',
 border: 'rgba(0,0,0,0.08)',
 borderDark: 'rgba(0,0,0,0.12)',
 hover: '#2A4A30',
 tableAlt: '#FAFAF8'
 }
 }
 }
 }
 }
 </script>
 <style>
 body {
 background-color: #F4F4EF;
 color: #111111;
 font-family: 'General Sans', sans-serif;
 -webkit-font-smoothing: antialiased;
 margin: 0;
 }
 * { font-family: 'General Sans', sans-serif; }

 /* Custom Scrollbar */
 ::-webkit-scrollbar {
 width: 6px;
 height: 6px;
 }

 ::-webkit-scrollbar-track {
 background: transparent;
 }

 ::-webkit-scrollbar-thumb {
 background: #D1D5DB;
 border-radius: 3px;
 }

 ::-webkit-scrollbar-thumb:hover {
 background: #9CA3AF;
 }

 .sidebar-link {
 display: flex;
 align-items: center;
 gap: 12px;
 padding: 10px 16px;
 border-radius: 8px;
 font-size: 0.875rem;
 font-weight: 500;
 color: rgba(255, 255, 255, 0.7);
 transition: none; /* ZERO animations */
 }

 .sidebar-link:hover {
 background-color: rgba(255, 255, 255, 0.05);
 color: #FFFFFF;
 }

 .sidebar-link.active {
 background-color: rgba(255, 255, 255, 0.1);
 color: #FFFFFF;
 border: 1px solid rgba(255, 255, 255, 0.05);
 }
 
 /* Admin Card Styles for Content Area */
 .admin-card {
 background-color: #FFFFFF;
 border: 1px solid rgba(0,0,0,0.08);
 border-radius: 20px;
 padding: 24px;
 box-shadow: 0 4px 20px rgba(0,0,0,0.06);
 transition: none; /* ZERO animations */
 }
 .admin-header {
 font-size: 24px;
 font-weight: 600;
 color: #181D00;
 letter-spacing: -0.02em;
 margin-bottom: 24px;
 }
 </style>
</head>

<body class="antialiased h-screen flex overflow-hidden bg-admin-surface" x-data="{ sidebarOpen: false }">

 <!-- Sidebar (Desktop) -->
 <aside class="hidden lg:flex w-64 bg-admin-sidebar border-r border-white/5 flex-col z-20">
 <!-- Logo -->
 <div class="h-16 flex items-center px-6 border-b border-white/10">
        <div class="flex items-center gap-2">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="EduEco Logo" class="w-8 h-8 rounded-full object-cover">
            <span class="font-bold text-lg text-white tracking-tight">EduEco <span class="text-xs font-normal text-white/50 ml-1">Admin</span></span>
 </div>
 </div>

 <!-- Navigation -->
 <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
 <div class="px-3 mb-2">
 <span class="text-[10px] font-bold text-white/50 uppercase tracking-wider">Main</span>
 </div>

 <a href="{{ url_for('admin_dashboard') }}"
 class="sidebar-link {% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
 <i data-lucide="layout-dashboard" class="w-5 text-center"></i>
 <span>Dashboard</span>
 </a>

 <div class="px-3 mb-2 mt-6">
 <span class="text-[10px] font-bold text-white/50 uppercase tracking-wider">Content</span>
 </div>

 <a href="{{ url_for('admin_add_challenge') }}"
 class="sidebar-link {% if request.endpoint == 'admin_add_challenge' %}active{% endif %}">
 <i data-lucide="plus-circle" class="w-5 text-center"></i>
 <span>Add Challenge</span>
 </a>
 <a href="{{ url_for('admin_random_challenge') }}"
 class="sidebar-link {% if request.endpoint == 'admin_random_challenge' %}active{% endif %}">
 <i data-lucide="wand-2" class="w-5 text-center"></i>
 <span>Auto Generator</span>
 </a>
 <a href="{{ url_for('admin_achievements') }}"
 class="sidebar-link {% if request.endpoint == 'admin_achievements' %}active{% endif %}">
 <i data-lucide="award" class="w-5 text-center"></i>
 <span>Achievements</span>
 </a>
 <a href="{{ url_for('admin_eco_tips') }}"
 class="sidebar-link {% if request.endpoint == 'admin_eco_tips' %}active{% endif %}">
 <i data-lucide="lightbulb" class="w-5 text-center"></i>
 <span>Eco Tips</span>
 </a>
 <a href="{{ url_for('admin_puzzles') }}"
 class="sidebar-link {% if request.endpoint == 'admin_puzzles' %}active{% endif %}">
 <i data-lucide="puzzle" class="w-5 text-center"></i>
 <span>Puzzles</span>
 </a>

 <div class="px-3 mb-2 mt-6">
 <span class="text-[10px] font-bold text-white/50 uppercase tracking-wider">Directory</span>
 </div>

 <a href="{{ url_for('admin_students') }}"
 class="sidebar-link {% if request.endpoint == 'admin_students' %}active{% endif %}">
 <i data-lucide="graduation-cap" class="w-5 text-center"></i>
 <span>Students</span>
 </a>
 <a href="{{ url_for('admin_teachers') }}"
 class="sidebar-link {% if request.endpoint == 'admin_teachers' %}active{% endif %}">
 <i data-lucide="presentation" class="w-5 text-center"></i>
 <span>Teachers</span>
 </a>
 <a href="{{ url_for('admin_levels') }}"
 class="sidebar-link {% if request.endpoint == 'admin_levels' %}active{% endif %}">
 <i data-lucide="layers" class="w-5 text-center"></i>
 <span>Levels</span>
 </a>

 </nav>

 <!-- User Profile -->
 <div class="p-4 border-t border-white/10">
 <a href="{{ url_for('admin_logout') }}"
 class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-admin-surface/5 text-white/70 hover:text-red-400 transition-none">
 <i data-lucide="log-out" class="w-5 text-center"></i>
 <span class="text-sm font-medium">Log out</span>
 </a>
 </div>
 </aside>

 <!-- Mobile Header -->
 <div
 class="lg:hidden fixed top-0 left-0 right-0 h-16 bg-admin-sidebar border-b border-white/10 flex items-center justify-between px-4 z-30">
        <div class="flex items-center gap-2">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="EduEco Logo" class="w-8 h-8 rounded-full object-cover">
            <span class="font-bold text-white">EduEco Admin</span>
 </div>
 <button @click="sidebarOpen = !sidebarOpen" class="text-white/70 hover:text-white transition-none">
 <i data-lucide="menu" class="w-5 h-5"></i>
 </button>
 </div>

 <!-- Mobile Sidebar Overlay -->
 <div x-show="sidebarOpen" class="fixed inset-0 bg-admin-sidebar/80 backdrop-blur-sm z-40 lg:hidden" @click="sidebarOpen = false"
 style="display: none;"></div>

 <!-- Mobile Sidebar -->
 <div x-show="sidebarOpen"
 class="fixed inset-y-0 left-0 w-64 bg-admin-sidebar z-50 lg:hidden flex flex-col border-r border-white/10 transition-none"
 style="display: none;">

 <div class="h-16 flex items-center px-6 border-b border-white/10">
 <span class="font-bold text-lg text-white">Menu</span>
 <button @click="sidebarOpen = false" class="ml-auto text-white/70 transition-none">
 <i data-lucide="x" class="w-5 h-5"></i>
 </button>
 </div>

 <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
 <a href="{{ url_for('admin_dashboard') }}" class="sidebar-link">Dashboard</a>
 <a href="{{ url_for('admin_students') }}" class="sidebar-link">Students</a>
 <a href="{{ url_for('admin_logout') }}" class="sidebar-link text-red-400">Log out</a>
 </nav>
 </div>

 <!-- Main Content -->
 <main class="flex-1 flex flex-col h-screen overflow-hidden bg-admin-surface pt-16 lg:pt-0">
 <div class="flex-1 overflow-auto p-6 md:p-8 bg-admin-surface">
 {% block content %}{% endblock %}
 </div>
 </main>

 <!-- Alpine.js -->
 <script src="//unpkg.com/alpinejs" defer></script>
 <!-- Lucide Icons -->
 <script src="https://unpkg.com/lucide@latest"></script>
 <script>
   lucide.createIcons();
 </script>
</body>

</html>
