{% extends"adminbase.html" %}

{% block title %}Add Achievement | EduEco Admin{% endblock %}

{% block content %}
<div class="max-w-[1400px] mx-auto pb-10 flex justify-center">
    
    <div class="w-full max-w-3xl">
        <!-- Header -->
        <div class="mb-8 flex items-center justify-between">
            <div>
                <a href="{{ url_for('admin_achievements') }}" class="inline-flex items-center gap-2 text-[13px] font-semibold text-admin-textMuted hover:text-[#111111] transition-none mb-3">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Directory
                </a>
                <h1 class="text-[32px] font-semibold text-admin-text tracking-tight mb-1">Create Achievement</h1>
                <p class="text-[15px] text-admin-textMuted">Design a new badge and unlocking criteria.</p>
            </div>
        </div>

        <div class="admin-card">
            <form method="POST" class="space-y-8">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-admin-textMuted uppercase tracking-wider mb-2">Achievement Name</label>
                        <input type="text" name="name" required
                            class="w-full bg-[#FFFFFF] border border-[rgba(0,0,0,0.12)] rounded-lg px-4 py-2.5 text-sm text-admin-text focus:border-[#2A4A30] focus:ring-1 focus:ring-[#2A4A30] outline-none transition-none"
                            placeholder="e.g. Master Recycler">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-admin-textMuted uppercase tracking-wider mb-2">Description</label>
                    <textarea name="description" required rows="3"
                        class="w-full bg-[#FFFFFF] border border-[rgba(0,0,0,0.12)] rounded-lg px-4 py-2.5 text-sm text-admin-text focus:border-[#2A4A30] focus:ring-1 focus:ring-[#2A4A30] outline-none transition-none"
                        placeholder="e.g. Awarded for completing 50 waste reduction challenges."></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-admin-textMuted uppercase tracking-wider mb-2">Emoji Icon</label>
                        <input type="text" name="icon" required
                            class="w-full bg-[#FFFFFF] border border-[rgba(0,0,0,0.12)] rounded-lg px-4 py-2.5 text-2xl text-center text-admin-text focus:border-[#2A4A30] focus:ring-1 focus:ring-[#2A4A30] outline-none transition-none"
                            placeholder="🌟">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-admin-textMuted uppercase tracking-wider mb-2">Criteria Type</label>
                        <select name="criteria_type" required
                            class="w-full bg-[#FFFFFF] border border-[rgba(0,0,0,0.12)] rounded-lg px-4 py-2.5 text-sm text-admin-text focus:border-[#2A4A30] focus:ring-1 focus:ring-[#2A4A30] outline-none transition-none appearance-none">
                            <option value="challenges_completed">Challenges Completed</option>
                            <option value="points_earned">Points Earned</option>
                            <option value="streak_days">Login Streak (Days)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-admin-textMuted uppercase tracking-wider mb-2">Target Value</label>
                        <input type="number" name="criteria_value" required min="1"
                            class="w-full bg-[#FFFFFF] border border-[rgba(0,0,0,0.12)] rounded-lg px-4 py-2.5 text-sm text-admin-text focus:border-[#2A4A30] focus:ring-1 focus:ring-[#2A4A30] outline-none transition-none"
                            placeholder="e.g. 50">
                    </div>
                </div>

                <div class="pt-8 flex justify-end gap-4">
                    <a href="{{ url_for('admin_achievements') }}"
                        class="px-6 py-2.5 bg-admin-surface border border-admin-border text-admin-text text-sm font-semibold rounded-lg hover:bg-[#FAFAF8] transition-none">
                        Cancel
                    </a>
                    <button type="submit"
                        class="px-8 py-2.5 bg-[#111111] hover:bg-[#2A4A30] text-white text-sm font-semibold rounded-lg shadow-sm border border-transparent transition-none">
                        Create Badge
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
